# Continuous integration: formatting, vet, build and tests on every change,
# plus a config check of the release machinery.
#
# `workflow_call` exists so .github/workflows/release.yml can require the same
# checks on a tag before GoReleaser publishes anything.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

  # Keeps .goreleaser.yaml honest: runs on every pull request, so a broken
  # release config is caught long before the next tag.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
